name: Jagruk Meme Bot

on:
  workflow_dispatch:
  schedule:
    # Har 7 ghante me auto - 12 AM, 7 AM, 2 PM, 9 PM IST
    - cron: "30 18 * * *"
    - cron: "30 1 * * *"
    - cron: "30 8 * * *"
    - cron: "30 15 * * *"

jobs:
  make-memes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Bot - Search + Convert + Telegram Only
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      # ❌ GitHub pe save karne wala step HATA DIYA HAI
      # Pehle yahan git add output/ + git push tha, ab nahi hai
      # Isliye output/ GitHub pe save NAHI hoga, repo halka rahega
      # Video sirf Telegram pe jayegi, wahi se download karke Insta pe daalna hai
