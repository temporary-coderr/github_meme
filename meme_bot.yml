name: Jagruk Meme Bot - Auto Save to GitHub

on:
  schedule:
    - cron: '30 4,9,14 * * *'  # 10AM, 3PM, 8PM IST = 04:30, 09:30, 14:30 UTC
  workflow_dispatch:  # Manual run button

permissions:
  contents: write

jobs:
  fetch-memes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install deps
        run: pip install -r requirements.txt
        
      - name: Run Bot - Fetch & Restyle 5 Memes
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: jagruk-meme-bot-github
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py --once --count 5
        
      - name: Commit & Push to GitHub
        run: |
          git config user.name "Jagruk Meme Bot"
          git config user.email "bot@jagruk.com"
          git add output/ seen_urls.txt || true
          git commit -m "New memes $(date +'%Y-%m-%d %H:%M')" || echo "No new memes"
          git push origin main || echo "Nothing to push"
