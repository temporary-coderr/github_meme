name: Jagruk Meme Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'

permissions:
  contents: write

jobs:
  fetch-memes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run Bot
        run: |
          ls -la
          python main.py
          echo "--- OUTPUT CHECK ---"
          ls -R output || echo "NO OUTPUT FOLDER"
      - name: Commit and Push
        run: |
          git config user.name "Jagruk Meme Bot"
          git config user.email "bot@jagruk.com"
          git add -f output/ || true
          git status
          git commit -m "New memes $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push origin main || echo "Push failed"
